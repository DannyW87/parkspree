<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Park Spree | Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue: #2257A8;
            --yellow: #F3B63F;
            --cream: #F8F5EE;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html,
        body {
            height: 100%
        }

        body {
            font-family: Poppins, sans-serif;
            background: var(--cream);
            overflow: hidden;
            color: var(--blue);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        body::before{
            content:"";
            position:fixed;
            inset:0;
            pointer-events:none;

            background:
                repeating-linear-gradient(
                    to right,
                    var(--blue) 0 32px,
                    var(--yellow) 32px 64px
                ) top / 100% 20px no-repeat,

                repeating-linear-gradient(
                    to right,
                    var(--blue) 0 32px,
                    var(--yellow) 32px 64px
                ) bottom / 100% 20px no-repeat,

                repeating-linear-gradient(
                    to bottom,
                    var(--blue) 0 32px,
                    var(--yellow) 32px 64px
                ) left / 20px 100% no-repeat,

                repeating-linear-gradient(
                    to bottom,
                    var(--blue) 0 32px,
                    var(--yellow) 32px 64px
                ) right / 20px 100% no-repeat;

            animation:borderFlash 3s steps(1) infinite;
        }

        @keyframes borderFlash{

            0%,49.999%{

                background:
                    repeating-linear-gradient(
                        to right,
                        var(--blue) 0 32px,
                        var(--yellow) 32px 64px
                    ) top / 100% 20px no-repeat,

                    repeating-linear-gradient(
                        to right,
                        var(--blue) 0 32px,
                        var(--yellow) 32px 64px
                    ) bottom / 100% 20px no-repeat,

                    repeating-linear-gradient(
                        to bottom,
                        var(--blue) 0 32px,
                        var(--yellow) 32px 64px
                    ) left / 20px 100% no-repeat,

                    repeating-linear-gradient(
                        to bottom,
                        var(--blue) 0 32px,
                        var(--yellow) 32px 64px
                    ) right / 20px 100% no-repeat;

            }

            50%,100%{

                background:
                    repeating-linear-gradient(
                        to right,
                        var(--yellow) 0 32px,
                        var(--blue) 32px 64px
                    ) top / 100% 20px no-repeat,

                    repeating-linear-gradient(
                        to right,
                        var(--yellow) 0 32px,
                        var(--blue) 32px 64px
                    ) bottom / 100% 20px no-repeat,

                    repeating-linear-gradient(
                        to bottom,
                        var(--yellow) 0 32px,
                        var(--blue) 32px 64px
                    ) left / 20px 100% no-repeat,

                    repeating-linear-gradient(
                        to bottom,
                        var(--yellow) 0 32px,
                        var(--blue) 32px 64px
                    ) right / 20px 100% no-repeat;

            }

        }

        .glow {
            position: absolute;
            width: min(60vw, 600px);
            aspect-ratio: 1;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(243, 182, 63, .28), rgba(243, 182, 63, 0));
            transform: translate(-50%, -50%);
            left: 50%;
            top: 50%;
            transition: transform .15s linear;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: min(92vw, 760px);
            text-align: center;
            padding: 2rem;
            animation: fade .8s ease;
        }

        .logo {
            width: min(340px, 20vw);
            height: auto;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: clamp(2rem, 4vw, 3.2rem);
            margin-bottom: .5rem
        }

        p {
            color: #6677a4;
            margin-bottom: 2rem
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin: 2rem 0;
        }

        .card {
            background: #fff;
            border-radius: 18px;
            padding: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);
        }

        .card span {
            display: block;
            font-size: 2rem;
            font-weight: 700;
        }

        .card small {
            color: #6677a4;
            text-transform: uppercase;
            font-size: .75rem;
        }

        .button {
            display: inline-block;
            margin-top: 1rem;
            background: var(--blue);
            color: #fff;
            text-decoration: none;
            padding: .95rem 1.6rem;
            border-radius: 999px;
            transition: .25s;
        }

        .button:hover {
            transform: translateY(-2px);
            background: #173f7b
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(15px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @media(max-width:640px) {
            .countdown {
                grid-template-columns: repeat(2, 1fr);
            }

            .container {
                padding: 1.5rem
            }

            .logo {
                width: min(240px, 30vw)
            }

            body::before {
                background:
                    repeating-linear-gradient(to right, var(--blue) 0 24px, var(--yellow) 24px 48px) top/100% 14px no-repeat,
                    repeating-linear-gradient(to right, var(--blue) 0 24px, var(--yellow) 24px 48px) bottom/100% 14px no-repeat,
                    repeating-linear-gradient(to bottom, var(--blue) 0 24px, var(--yellow) 24px 48px) left/14px 100% no-repeat,
                    repeating-linear-gradient(to bottom, var(--blue) 0 24px, var(--yellow) 24px 48px) right/14px 100% no-repeat;
            }
        }
    </style>
</head>

<body>
    <div class="glow" id="glow"></div>
    <div class="container" id="container">
        <img src="logo.png" class="logo" alt="Park Spree logo">
        <h1>Adventure is Almost Here</h1>
        <p>Theme park inspired apparel. <br /> Launching Soon.</p>

        <!-- <div class="countdown">
            <div class="card"><span id="days">00</span><small>Days</small></div>
            <div class="card"><span id="hours">00</span><small>Hours</small></div>
            <div class="card"><span id="minutes">00</span><small>Minutes</small></div>
            <div class="card"><span id="seconds">00</span><small>Seconds</small></div>
        </div> -->

        <span>Follow us on Instagram for the latest news and updates.</span><br/>
        <a class="button" href="https://instagram.com/parkspree" target="_blank">@parkspree</a>
    </div>

    <script>
        const target = new Date(new Date().getFullYear(), 8, 14);
        function update() {
            let d = target - new Date();
            if (d < 0) d = 0;
            days.textContent = String(Math.floor(d / 86400000)).padStart(2, "0");
            hours.textContent = String(Math.floor((d % 86400000) / 3600000)).padStart(2, "0");
            minutes.textContent = String(Math.floor((d % 3600000) / 60000)).padStart(2, "0");
            seconds.textContent = String(Math.floor((d % 60000) / 1000)).padStart(2, "0");
        }
        update();
        setInterval(update, 1000);

        const glow = document.getElementById("glow");
        document.addEventListener("mousemove", e => {
            const x = (e.clientX / window.innerWidth - .5) * 90;
            const y = (e.clientY / window.innerHeight - .5) * 90;
            glow.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
        });
    </script>
</body>

</html>
